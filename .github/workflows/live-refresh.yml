name: Refresh live baseball data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseball-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh current stats, today's games and transactions
        run: python update_stats.py --mode live

      - name: Commit live data changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.json today_schedule.json transactions.json players.json

          if git diff --cached --quiet; then
            echo "No live baseball changes to publish"
            exit 0
          fi

          git commit -m "Refresh live baseball data"

          git fetch origin main
          git rebase origin/main

          if ! git push origin HEAD:main; then
            echo "Main changed again; rebasing one more time"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
