name: Refresh live baseball data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-baseball-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh current stats and today's games
        run: python update_stats.py --mode live

      - name: Commit live data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.json today_schedule.json players.json

          if git diff --cached --quiet; then
            echo "No live baseball changes to publish"
            exit 0
          fi

          git commit -m "Refresh live baseball data"
          git push
